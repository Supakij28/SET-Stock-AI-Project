name: Auto Market Scanner

on:
  schedule:
    # ระบุเวลา UTC เจาะจง (ตรงกับ 10:00, 10:30, 11:00, 11:30, 14:30, 15:00, 15:30, 16:00 น. ไทย)
    - cron: '0,30 3,4,7,8,9 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas supabase yfinance yahooquery requests numpy python-dotenv dtaidistance scikit-learn pytz

      - name: Run Market Scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/cron_scanner.py
