name: Auto Market Scanner

on:
  schedule:
    # Runs every 30 minutes during Thai market hours (10:00 - 16:30 ICT -> 03:00 - 09:30 UTC)
    - cron: '*/30 3-9 * * 1-5'
  workflow_dispatch: # Allow manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance yahooquery pandas numpy supabase python-dotenv dtaidistance scikit-learn pytz

      - name: Run Market Scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          IS_MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/cron_scanner.py
